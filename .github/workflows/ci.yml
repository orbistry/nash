name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Install components
        run: rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test
      - name: Core acceptance
        run: cargo run -p nash-cli -- check tests/core
      - name: Property counterexample acceptance
        shell: bash
        run: |
          status=0
          cargo run -p nash-cli -- test examples/order --seed 1 > /tmp/nash-order.log 2>&1 || status=$?
          cat /tmp/nash-order.log
          test "$status" -eq 1
          grep -q '× counterexample' /tmp/nash-order.log
