[package]
name = "nash-constrain"
version = "0.10.0"
edition.workspace = true
description = """
Responsible for building the set of constraints that are used \
during type inference of a program, and for gathering context \
needed for pleasant error messages when a type error occurs.
"""
homepage.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
bumpalo.workspace = true
nash-ast = { path = "../nash-ast", version = "0.13.0" }
nash-region = { path = "../nash-region", version = "0.3.0" }
nash-can = { path = "../nash-can", version = "0.14.0" }

[dev-dependencies]
insta.workspace = true
