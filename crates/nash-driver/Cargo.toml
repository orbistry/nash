[package]
name = "nash-driver"
version = "0.11.0"
edition.workspace = true
description = "Build system and driver for Nash projects"
homepage.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
nash-test = { path = "../nash-test", version = "0.4.1" }
nash-codegen = { path = "../nash-codegen", version = "0.4.2" }
nash-plutus = { path = "../nash-plutus", version = "0.3.2" }
async-trait.workspace = true
bumpalo.workspace = true
glob.workspace = true
hex.workspace = true
miette.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "fs"] }
url.workspace = true

nash-config = { path = "../nash-config", version = "0.5.0" }
nash-nitpick = { path = "../nash-nitpick", version = "0.3.2" }
nash-ast = { path = "../nash-ast", version = "0.11.0" }
nash-can = { path = "../nash-can", version = "0.12.0" }
nash-constrain = { path = "../nash-constrain", version = "0.8.2" }
nash-parse = { path = "../nash-parse", version = "0.8.0" }
nash-report = { path = "../nash-report", version = "0.5.3" }
nash-region = { path = "../nash-region", version = "0.3.0" }
nash-solve = { path = "../nash-solve", version = "0.9.1" }
nash-source = { path = "../nash-source", version = "0.9.0" }

[dev-dependencies]
indoc.workspace = true
insta.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
